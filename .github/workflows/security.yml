name: Security checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lunch_test
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: lunch_payment_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lunch_test -d lunch_payment_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PAYMENT_TEST_DATABASE_URL: postgres://lunch_test:ci-local-password@127.0.0.1:5432/lunch_payment_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=low
      - run: python3 scripts/scan-secrets.py
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lunch-ui-screenshots-and-report
          path: |
            server/ui-results
            server/ui-report
          retention-days: 14
